[build]
  publish = "."

# Fonts never change, so they can be cached for a long time.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images can be replaced under the same name, so browsers re-check them.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
